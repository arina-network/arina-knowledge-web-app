<style>
  /* Force the sidenav's internal material structural box to layout horizontally */
  ::ng-deep .mat-drawer-inner-container,
  ::ng-deep .mat-sidenav-inner-container {
    display: flex !important;
    flex-direction: row !important;
    overflow: hidden !important;
  }

  /* Keep the tree elements container flexible */
  .sidenav-tree-holder {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    height: 100%;
    width: 100%;
  }

  /* Style your interactive resize strip */
  .resize-handle {
    width: 8px !important;
    min-width: 8px !important;
    cursor: col-resize !important;
    background-color: #cbd5e1 !important; /* Visible slate gray bar */
    align-self: stretch !important;
    z-index: 50 !important;
    height: 100% !important;
  }

  /* Turn vibrant blue when mouse hovers over it */
  .resize-handle:hover {
    background-color: #3b82f6 !important;
  }
</style>

<mat-sidenav-container autosize class="h-full">
    <mat-sidenav mode="side" opened class="m-2" [style.width.px]="sidenavWidth">
        <div class="sidenav-tree-holder">   
            <app-progress [loading]="isDataLoading()"></app-progress>
            <!-- <app-messages [messages]="messages"></app-messages> -->

            <mat-tree #tree [dataSource]="dataSource()" [childrenAccessor]="getChildren" class="m-1">
                
                <!-- leaf nodes -->
                <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding
                    routerLink="/{{routes.knowledge}}/{{owner}}/{{repository}}/{{branch}}/{{node.key}}"
                    routerLinkActive="bg-blue-100 text-blue-700 rounded-[5px]"
                    [routerLinkActiveOptions]="{ exact: true }"
                    #nodeElement [attr.data-node-key]="node.key"
                    >
                    <button mat-icon-button disabled class="w-6"></button>
                    <mat-icon class="mr-2" fontSet="material-symbols-outlined">
                        {{node.getIconName()}}
                    </mat-icon>
                    {{node.name}}
                </mat-tree-node>

                <!-- expandable branch nodes -->
                    <!-- routerLink="/{{routes.knowledge}}/{{owner}}/{{repository}}/{{branch}}/{{node.key}}" [routerLinkActive]='["node-active"]'> -->
                <mat-tree-node *matTreeNodeDef="let node; when: hasChild" matTreeNodePadding
                    routerLink="/{{routes.knowledge}}/{{owner}}/{{repository}}/{{branch}}/{{node.key}}"
                    routerLinkActive="bg-blue-100 text-blue-700 rounded-[5px]"
                    [routerLinkActiveOptions]="{ exact: true }"
                    #nodeElement [attr.data-node-key]="node.key"
                    >
                    <!-- Handle dynamic lazy loading on user toggle action -->
                    <button mat-icon-button 
                            (click)="onNodeToggle(tree, node)" 
                            [attr.aria-label]="'Toggle ' + node.name">
                        <mat-icon class="mat-icon-rtl-mirror">
                            {{ tree.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                        </mat-icon>
                        <mat-icon class="mr-2" fontSet="material-symbols-outlined">{{node.getIconName()}}</mat-icon>
                    </button>
                    {{node.name}}
                    <!-- loading indicator per node -->
                    @if (node.isLoading) {
                        <!-- <span class="loading-text">Loading...</span> -->
                        &nbsp;<mat-progress-bar class="ml-2 max-w-[50px]" mode="indeterminate"></mat-progress-bar>
                    }
                </mat-tree-node>
            </mat-tree>
        </div>
        
        <div class="resize-handle" (mousedown)="startResize($event)"></div>
    </mat-sidenav>
    <mat-sidenav-content class="h-full p-2 overflow-y-auto">
        <div class="h-full w-full">
            <app-structure-view></app-structure-view>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
