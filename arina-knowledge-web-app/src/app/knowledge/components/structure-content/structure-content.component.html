<app-progress [loading]="isDataLoading()"></app-progress>

<div class="ml-4">
    @if (source() | markdown:true | async; as htmlContent) {
        <div #renderedContent class="prose max-w-5xl p-4 mx-4" [innerHTML]="htmlContent | safeHtml">
        </div>
        <hr class="my-4 border-t border-gray-300">
    } @else if (source() !== undefined && !source()?.trim()) {
        <p #renderedContent class="mx-4 p-4 text-sm text-slate-600">{{ key() }} is empty.</p>
    }
</div>
